<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="color-scheme" content="light dark" />
  <title>Lunas DPI — Lua API</title>
  <meta name="description" content="Lua plugin API documentation for Lunas DPI." />
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml" />
  <script>
    {
      const colorScheme = localStorage.getItem("color-scheme") || localStorage.getItem("luna-docs-theme");
      if (colorScheme === "light" || colorScheme === "dark") {
        document.querySelector('meta[name="color-scheme"]').content = colorScheme;
        document.documentElement.classList.add("theme-" + colorScheme);
      }
    }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="assets/style.css" />
</head>
<body>
  <a class="skip" href="#content">Skip to content</a>
  <header class="topbar">
    <button class="icon-btn menu-btn" type="button" aria-label="Open navigation" aria-expanded="false" id="menuBtn">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
    <a class="brand" href="#welcome">
      <img src="assets/logo.svg" width="32" height="32" alt="" />
      <span>Lunas DPI</span>
    </a>
    <nav class="top-links">
      <a href="#welcome">Docs</a>
      <a href="#Client">API</a>
      <a href="https://github.com/emirassssssssn/lunasdpi" rel="noopener noreferrer" target="_blank">GitHub</a>
    </nav>
    <div class="top-actions">
      <button class="search-open" type="button" id="searchOpen">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3-3"/></svg>
        <span class="search-open-label">Search</span>
        <kbd>Ctrl K</kbd>
      </button>
      <span class="version">luna · api_level 1</span>
      <button class="theme-btn" type="button" id="themeBtn" aria-label="Toggle theme">
        <svg class="icon-sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3 7 7 0 0 0 21 14.5z"/></svg>
      </button>
    </div>
  </header>

  <div class="shell">
    <aside class="sidebar" id="sidebar"></aside>
    <main class="main" id="content" tabindex="-1"></main>
    <aside class="outline" id="outline"></aside>
  </div>

  <div class="scrim" id="navScrim" hidden></div>
  <dialog class="search-layer" id="searchLayer" aria-labelledby="searchTitle">
    <div class="search-panel">
      <div class="search-head">
        <h2 id="searchTitle">Search documentation</h2>
        <input id="searchInput" type="search" placeholder="Search classes, methods, guides…" autocomplete="off" />
        <button class="search-close" type="button" id="searchClose" aria-label="Close search">Close</button>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
  </dialog>

  <script src="assets/api.js"></script>
  <script src="assets/app.js"></script>
</body>
</html>
